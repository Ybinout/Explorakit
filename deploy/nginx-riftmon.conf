# Canonical RiftMon domain. Knov keeps its own app.binout.fr vhost.
server {
    listen 80;
    listen [::]:80;
    server_name riftmon.binout.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/riftmon-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://riftmon.binout.fr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name riftmon.binout.fr;
    ssl_certificate /etc/letsencrypt/live/riftmon.binout.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riftmon.binout.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Lossless transfer compression, scoped to RiftMon rather than the shared VPS.
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
