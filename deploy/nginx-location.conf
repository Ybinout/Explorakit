    # Only the former game prefix moves. Leave Knov's location / intact.
    location = /explorakit { return 301 https://riftmon.binout.fr/$is_args$args; }

    # Keep already-open clients, battles and installed legacy PWAs working.
    # Static bundles are retained during publication; no account tokens redirect.
    location ~ ^/explorakit/(?:(?:api|socket\.io|js|css|img|media|icons)(?:/|$)|(?:service-worker\.js|manifest\.webmanifest|offline\.html|favicon\.ico)$) {
        rewrite ^/explorakit/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /explorakit/ {
        rewrite ^/explorakit/(.*)$ https://riftmon.binout.fr/$1 permanent;
    }
